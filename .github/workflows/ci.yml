name: PayFlow CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Test & Race Detection
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: payflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Unit Tests
        run: go test -v -cover ./internal/domain/... ./internal/api/...

      - name: Run PostgreSQL Integration Tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/payflow_test?sslmode=disable
        run: go test -v ./internal/repository/postgres/...

      - name: Run Concurrency & Race Detection
        env:
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/payflow_test?sslmode=disable
        run: go test -race -v ./...

      - name: Build Static Binaries
        run: |
          go build -v -o bin/payflow-api ./cmd/api
          go build -v -o bin/payflow-worker ./cmd/worker
